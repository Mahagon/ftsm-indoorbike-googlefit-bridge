name: CI

on:
  pull_request:
    # Keep in sync with .github/scripts/change_scope.py android_ci scope.
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
      - ".github/scripts/android_smoke_test.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Check formatting, tests, and Android lint
        run: ./gradlew spotlessCheck testDebugUnitTest lintDebug --no-daemon
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore

  api-37-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools
      - name: Install Android 37 emulator SDK
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "system-images;android-37.0;google_apis_ps16k;x86_64"
          avdmanager list device | grep -q 'id:.*"pixel_9"' || {
            echo "Pixel 9 hardware profile is unavailable" >&2
            exit 1
          }
          echo no | avdmanager create avd --force --name test \
            --package "system-images;android-37.0;google_apis_ps16k;x86_64" \
            --device pixel_9
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Run instrumentation tests on Android 37
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0"
          channel: canary
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_9
          disk-size: 8G
          force-avd-creation: false
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android_smoke_test.sh
      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-37-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/smoke-diagnostics/
          if-no-files-found: ignore
