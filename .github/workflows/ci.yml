name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Test release version policy
        run: python .github/scripts/release_version_test.py
      - name: Check formatting, tests, and Android lint
        run: ./gradlew spotlessCheck testDebugUnitTest lintDebug --no-daemon
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore

  api-37-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools
      - name: Install Android 37 emulator SDK
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "system-images;android-37.0;google_apis_ps16k;x86_64"
          avdmanager list device | grep -q 'id:.*"pixel_9"' || {
            echo "Pixel 9 hardware profile is unavailable" >&2
            exit 1
          }
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Run instrumentation tests on Android 37
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.0"
          channel: canary
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_9
          disk-size: 8G
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          script: |
            diagnostics="$RUNNER_TEMP/smoke-diagnostics"
            collect_diagnostics() {
              mkdir -p "$diagnostics"
              cp -R "$HOME/.android/avd" "$diagnostics/avd" 2>/dev/null || true
              adb logcat -b all -d > "$diagnostics/logcat.txt" 2>&1 || true
              adb shell dumpsys activity crashes > "$diagnostics/activity-crashes.txt" 2>&1 || true
              adb shell dumpsys dropbox --print data_app_crash system_app_crash > "$diagnostics/dropbox-crashes.txt" 2>&1 || true
              adb shell getprop > "$diagnostics/device-properties.txt" 2>&1 || true
              adb shell df -h /data > "$diagnostics/data-filesystem.txt" 2>&1 || true
            }
            trap collect_diagnostics EXIT
            avd_target="$(grep -R '^target=' "$HOME/.android/avd" | head -1 || true)"
            echo "Resolved AVD target: $avd_target"
            [[ "$avd_target" == *"android-37.0"* ]] || exit 1
            grep -R -q '^hw.device.name=pixel_9$' "$HOME/.android/avd" || exit 1
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace --info
      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-37-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/smoke-diagnostics/
          if-no-files-found: ignore
