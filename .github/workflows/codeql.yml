name: CodeQL

on:
  push:
    branches:
      - main
    # Keep in sync with .github/scripts/change_scope.py production/actions scopes.
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/change_scope.py"
      - ".github/scripts/change_scope_test.py"
  # Required checks must be created for every pull request. Individual jobs
  # skip successfully after the lightweight classifier runs.
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.scope.outputs.production }}
      actions: ${{ steps.scope.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python .github/scripts/change_scope.py --all --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            from="$BASE_SHA"
            to="$HEAD_SHA"
          else
            from="$BEFORE_SHA"
            to="$GITHUB_SHA"
          fi

          if [[ "$from" =~ ^0+$ ]] || ! git cat-file -e "$from^{commit}"; then
            git ls-tree -r --name-only "$to" |
              python .github/scripts/change_scope.py --github-output "$GITHUB_OUTPUT"
          else
            git diff --name-only "$from" "$to" |
              python .github/scripts/change_scope.py --github-output "$GITHUB_OUTPUT"
          fi

  analyze-java-kotlin:
    name: Analyze java-kotlin
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.production == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Build application for analysis
        # CodeQL 2.26.3 supports Kotlin versions below 2.4.20. Keep the
        # production build patched while using a cache-free compatible
        # compiler only in this isolated analysis checkout.
        run: |
          sed -i 's/version "2.4.20-Beta2"/version "2.4.10"/' build.gradle.kts
          ./gradlew compileDebugKotlin --no-daemon --no-build-cache --no-configuration-cache
      - uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4

  analyze-actions:
    name: Analyze actions
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.actions == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
