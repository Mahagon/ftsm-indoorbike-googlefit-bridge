name: Auto Release

on:
  push:
    branches: [main]
    # Keep in sync with .github/scripts/change_scope.py production scope.
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: release-versioning
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged version
    runs-on: ubuntu-latest
    steps:
      - name: Find merged pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          pull_request=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last')
          if [ -z "$pull_request" ] || [ "$pull_request" = "null" ]; then
            echo "No merged pull request into main is associated with $COMMIT_SHA." >&2
            exit 1
          fi
          echo "head_ref=$(jq -r '.head.ref' <<< "$pull_request")" >> "$GITHUB_OUTPUT"
          echo "author=$(jq -r '.user.login' <<< "$pull_request")" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r '.number' <<< "$pull_request")" >> "$GITHUB_OUTPUT"
      - name: Dependabot exemption
        if: steps.pull-request.outputs.author == 'dependabot[bot]'
        run: echo "Dependabot pull request #${{ steps.pull-request.outputs.number }} does not create a release."
      - name: Check out merged commit and tags
        if: steps.pull-request.outputs.author != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Revalidate release version
        if: steps.pull-request.outputs.author != 'dependabot[bot]'
        id: version
        env:
          RELEASE_BRANCH: ${{ steps.pull-request.outputs.head_ref }}
        run: python .github/scripts/release_version.py "$RELEASE_BRANCH" --format github >> "$GITHUB_OUTPUT"
      - name: Create release tag
        if: steps.pull-request.outputs.author != 'dependabot[bot]'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Start release workflow
        if: steps.pull-request.outputs.author != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run release.yml --ref "$RELEASE_TAG"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not dispatch release.yml for $RELEASE_TAG." >&2
          exit 1
